spring.application.name=voucherAsssement


#  MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/voucher?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

#  JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#  Batch Configuration
spring.batch.job.enabled=true

#  Logging
logging.level.org.springframework.batch=INFO
logging.level.com.yourcompany.transactionapp=DEBUG